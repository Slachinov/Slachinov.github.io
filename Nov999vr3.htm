<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,
body{
width:100%;
height:100%;
margin:0;
}
</style>
<script src="js/qqv34.js"></script>
<script src="js/qqns1.js"></script>
<script type="module" src="js/console1.js"></script>
</head>
<body>
<script type="module">

const ns = qq.ns();

// --- APP ---
ns.set('app', qq.ce({
tag: 'div',
style: {
position: 'absolute',
top: '0',
left: '0',
width: '100%',
height: '100%',
overflow: 'hidden',
background: '#fff'
}
}));

// --- СЛОЙ 1: ЧАТ ---
ns.set('chat', qq.ce({
tag: 'div',
parent: ns.get('app'),
style: {
position: 'absolute',
top: '0',
left: '0',
width: '100%',
height: '100%',
display: 'flex',
flexDirection: 'column',
background: '#fff'
}
}));

// шапка
const header = qq.ce({
tag: 'div',
parent: ns.get('chat'),
style: {
display: 'flex',
alignItems: 'center',
gap: '10px',
padding: '10px',
borderBottom: '1px solid #eee',
flexShrink: '0'
}
});

qq.ce({
tag: 'button',
parent: header,
it: '≡',
style: { fontSize: '22px', border: 'none', background: 'none', cursor: 'pointer' },
event: {
click: function() {
ns.get('sidebar').style.display = 'flex';
}
}
});

qq.ce({
tag: 'div',
parent: header,
it: 'Чат',
style: { fontSize: '18px', fontWeight: 'bold' }
});

// сообщения
ns.set('messages', qq.ce({
tag: 'div',
parent: ns.get('chat'),
style: { flex: '1', overflowY: 'auto', padding: '10px' }
}));

// --- РЕДАКТОР ---
ns.set('editor', qq.ce({
tag: 'div',
parent: ns.get('chat'),
style: {
display: 'flex',
flexDirection: 'column',
gap: '8px',
padding: '8px',
borderTop: '1px solid #eee',
background: '#fff',
flexShrink: '0',
boxSizing: 'border-box'
}
}));

const editor = ns.get('editor');

// РЯД 1 — только поле ввода
const input = qq.ce({
tag: 'textarea',
parent: editor,
attr: { placeholder: 'Сообщение...', rows: '1' },
style: {
width: '100%',
boxSizing: 'border-box',
resize: 'none',
border: '1px solid #ddd',
borderRadius: '20px',
padding: '10px 14px',
fontSize: '16px',
outline: 'none',
maxHeight: '120px',
overflowY: 'auto'
},
event: {
input: function() {
this.style.height = 'auto';
this.style.height = this.scrollHeight + 'px';
}
}
});

// РЯД 2 — кнопки, как в оригинале
const toolbar = qq.ce({
tag: 'div',
parent: editor,
style: {
display: 'flex',
flexDirection: 'row',
justifyContent: 'space-between',
alignItems: 'center',
width: '100%'
}
});

// слева — +
qq.ce({
tag: 'button',
parent: toolbar,
it: '+',
style: { width: '36px', height: '36px', borderRadius: '50%', border: 'none', background: 'none', fontSize: '22px', cursor: 'pointer' }
});

// справа — группа кнопок
const toolbarRight = qq.ce({
tag: 'div',
parent: toolbar,
style: {
display: 'flex',
flexDirection: 'row',
alignItems: 'center',
gap: '4px'
}
});


// --- запоминаем высоту ---


let isExpanded = false;
let savedInputHeight = '';


const expandBtn = qq.ce({
tag: 'button',
parent: toolbarRight,
it: '⤢',
style: { width: '36px', height: '36px', border: 'none', background: 'none', fontSize: '20px', cursor: 'pointer' },
event: {
click: function() {
if (!isExpanded) {
// 1. запоминаем реальную высоту, а не style.height
savedInputHeight = input.offsetHeight + 'px';
isExpanded = true;


editor.style.position = 'absolute';
editor.style.top = '5px';
editor.style.left = '5px';
editor.style.right = '5px';
editor.style.bottom = '5px';
editor.style.width = 'auto';
editor.style.height = 'auto';
editor.style.zIndex = '10';
editor.style.border = '1px solid #ddd';
editor.style.borderRadius = '16px';


input.style.maxHeight = 'none';
input.style.flex = '1';
input.style.height = 'auto';


expandBtn.textContent = '⤡'; // меняем именно текст в DOM, а не .it
} else {
// 2. возвращаем
isExpanded = false;


editor.style.position = '';
editor.style.top = '';
editor.style.left = '';
editor.style.right = '';
editor.style.bottom = '';
editor.style.width = '';
editor.style.height = '';
editor.style.zIndex = '';
editor.style.borderRadius = '';


input.style.maxHeight = '120px';
input.style.flex = '';
input.style.height = savedInputHeight; // ставим запомненную


expandBtn.textContent = '⤢';
}
}
}
});
qq.ce({
tag: 'button',
parent: toolbarRight,
it: '🎤',
style: { width: '36px', height: '36px', border: 'none', background: 'none', fontSize: '18px', cursor: 'pointer' }
});

qq.ce({
tag: 'button',
parent: toolbarRight,
it: '↑',
style: {
width: '36px', height: '36px', borderRadius: '50%',
border: 'none', background: '#007aff', color: '#fff',
fontSize: '18px', cursor: 'pointer', flexShrink: '0'
}
});



// --- СЛОЙ 2: СПИСОК ВЕТОК ---
// Теперь это оверлей на весь экран: слева панель, справа полупрозрачный фон
ns.set('sidebar', qq.ce({
tag: 'div',
parent: ns.get('app'),
style: {
position: 'absolute',
top: '0', left: '0',
width: '100%', height: '100%',
display: 'none',
flexDirection: 'row',
zIndex: '20'
}
}));

const sidebar = ns.get('sidebar');

// Левая часть — сам список, как было
const sidebarPanel = qq.ce({
tag: 'div',
parent: sidebar,
style: {
width: '80%',
maxWidth: '300px',
height: '100%',
background: '#f5f5f5',
borderRight: '1px solid #ddd',
display: 'flex',
flexDirection: 'column',
flexShrink: '0'
}
});

qq.ce({
tag: 'div',
parent: sidebarPanel,
it: 'Ветки',
style: { padding: '14px', fontWeight: 'bold', borderBottom: '1px solid #ddd' }
});


qq.ce({
tag: 'div',
parent: sidebarPanel,
it: 'Ветка 1',
style: { padding: '12px 14px', borderBottom: '1px solid #eee', cursor: 'pointer' },
event: { click: function() { sidebar.style.display = 'none'; } }
});


qq.ce({
tag: 'div',
parent: sidebarPanel,
it: 'Ветка 2',
style: { padding: '12px 14px', borderBottom: '1px solid #eee', cursor: 'pointer' },
event: { click: function() { sidebar.style.display = 'none'; } }
});


// Правая часть — полупрозрачное затемнение, тап закрывает
qq.ce({
tag: 'div',
parent: sidebar,
style: {
flex: '1',
height: '100%',
background: 'rgba(0,0,0,0.35)',
cursor: 'pointer'
},
event: {
click: function() {
sidebar.style.display = 'none';
}
}
});


</script>
</body>
</html>
