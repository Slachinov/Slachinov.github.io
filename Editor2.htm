<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,
body{
  width:100%;
  height:100%;
 margin:0;
}
</style>
<script src="js/qqv34.js"></script>
<script src="js/qqns.js"></script>
<script type="module" src="js/console.js"></script>
</head>
<body>
<script type="module">


import { m, butonsEditPanel ,bottomPanel} from 'https://slachinov.github.io/Lib/pan/main.js';


import {} from 'https://slachinov.github.io/Editor/buttonsEdit3.js';
import CreateLocalStoragePanel from 'https://slachinov.github.io/Editor/panelLs.V3.js';


CreateLocalStoragePanel({edit:m.edit,parent:m.topPanel,all:m.all});
import GhPanel from 'https://slachinov.github.io/Editor/panelGh.V2.js';
GhPanel({ edit: m.edit, all: m.all, parent: m.topPanel });
import  'https://slachinov.github.io/Editor/panelIdb.js';

qq.ce({parent:butonsEditPanel,tag:'button', it:'Пустые',event:{click:function(){
let text=m.edit.innerText;
let lines = text.split('\n');
lines = lines.filter(line => line.trim() !== '');
text = lines.join('\n');
m.edit.innerText=text;
}}});

//=====
qq.ce({
    parent: butonsEditPanel,
    tag: 'button',
    it: '\uD83D\uDCE5', // 📥 Вставить
    title: 'Вставить',
    event: {
        click: async function () {
            try {
                let text = await navigator.clipboard.readText();
              //  text = text.replace(/&nbsp;/g, ' ');
                text = text.replace(/\u00A0/g, ' ');
                m.edit.innerText = text;
            } catch (err) {
                qq.er(err);
            }
        }
    }
});


qq.ce({
    parent: butonsEditPanel,
    tag: 'button',
    it: '\uD83D\uDCCB', // 📋 Копировать
    title: 'Копировать',
    event: {
        click: async function () {
            try {
                await navigator.clipboard.writeText(m.edit.innerText);
            } catch (err) {
                qq.er(err);
            }
        }
    }
});

//=====


</script>
</body>
</html>
