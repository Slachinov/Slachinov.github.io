<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
<button id="askBtn">Спросить Gemini 544 </button>

<script type="module">
import { GoogleGenAI } from 'https://esm.run';
alert(GoogleGenAI);
document.getElementById('askBtn').onclick = async () => {
let apiKey = localStorage.getItem( 'gemini_api_key');alert(apiKey);
if (!apiKey) {
apiKey = prompt('Вставьте ваш API-ключ:');
if (!apiKey) return;
localStorage.setItem('gemini_api_key', apiKey.trim());
}

const ai = new GoogleGenAI({ apiKey: apiKey });
alert(ai);
const response = await ai.models.generateContent({
model: 'gemini-2.5-flash',
contents: 'Объясни в двух словах, как работает ИИ',
});
alert(response);
alert(response.text);
};
</script>
</body>
</html>
