<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<button onclick="askGemini()" style="font-size: 20px; padding: 10px;">Быстрый запрос</button>
<pre id="out" style="white-space: pre-wrap; font-size: 16px; margin-top: 20px;"></pre>

<script>
async function askGemini() {
const out = document.getElementById('out');
let apiKey = localStorage.getItem('gemini_api_key');

if (!apiKey) {
apiKey = prompt('Вставьте ваш ключ (AQ...):');
if (!apiKey) return;
apiKey = apiKey.replace(/[^\x21-\x7E]/g, '');
localStorage.setItem('gemini_api_key', apiKey);
}

const start = performance.now();
out.textContent = 'Думаю...';

try {
const host = 'https://generativelanguage.googleapis.com';
const path = '/v1beta/models/gemini-flash-lite-latest:generateContent';
const res = await fetch(host + path, {
method: 'POST',
headers: {
'Content-Type': 'application/json',
'x-goog-api-key': apiKey
},
body: JSON.stringify({
contents: [{ parts: [{ text: 'сколько можно записать в indexedDb в мбайт?' }] }],
generationConfig: {
thinkingConfig: {
thinkingBudget: 0
}
}
})
});

const data = await res.json();
const sec = ((performance.now() - start) / 1000).toFixed(2);

if (data.error) {
out.textContent = `Ошибка (${sec} сек): ` + data.error.message;
} else {
const text = data.candidates?.at(0)?.content?.parts?.at(0)?.text;
out.textContent = `Ответ за ${sec} сек:\n\n` + text;
}
} catch (err) {
out.textContent = 'Ошибка сети: ' + err.message;
}
}
</script>
</body>
</html>
