<!DOCTYPE html>
<html lang="ru">
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.container {
display: grid;
grid-template-columns: 250px 1fr 300px; /* Левая панель, центр, правая панель */
grid-template-rows: 60px 1fr; /* Шапка и основная часть */
height: 100vh;
gap: 10px;
padding: 10px;
background: #f0f2f5;
}

.header { grid-column: 1 / -1; background: #2c3e50; color: white; }
.sidebar { background: #34495e; color: white; }
.main { background: #ffffff; }
.aside { background: #ecf0f1; }

/* Используем Flexbox для центрирования текста внутри панелей */
.panel {
display: flex;
align-items: center;
justify-content: center;
border-radius: 8px;
font-family: sans-serif;
}
</style>
</head>
<body>

<div class="container">
<header class="header panel">Верхняя панель (Header)</header>
<nav class="sidebar panel">Левое меню (Sidebar)</nav>
<main class="main panel">Основной контент (Main)</main>
<aside class="aside panel">Доп. панель (Aside)</aside>
</div>

</body>
</html>
