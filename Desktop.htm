<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,
body{
width:100%;

}

<body>
<script type="module">
const ns=qq.ns();alert(ns);


alert(Object.prototype.toString.call(ns));

const desktop = qq.ce({
tag: 'div',
style: {
position: 'absolute',
left: '0',
top: '0',
width: '100%',
height: '100%',
zIndex: '10',
display: 'flex',
flexDirection: 'column'
}
});


const header = qq.ce({
tag: 'div',
parent: desktop,
style: {
background: '#d88',
padding: '2px'
}
});


const main = qq.ce({
tag: 'div',
parent: desktop,

}
});


const footer = qq.ce({
tag: 'div',
parent: desktop,
style: {
background: '#88d',
padding: '10px'
}
});


qq.ce({
tag: 'button',
parent: header,
it: 'На весь экран',
event: {
click: function () {
if (!document.fullscreenElement)
document.documentElement.requestFullscreen();
else
document.exitFullscreen();
}
}
});

</script>
