<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,
body{
width:100%;
height:100%;
margin:0;
}
</style>
<script src="js/qqv34.js"></script>
<script src="js/qqns.js"></script>
<script type="module" src="js/console.js"></script>
</head>
<body>
<script type="module">




const ns = qq.ns()


ns.set('app',qq.ce({
tag:'div',
style:{
position:'absolute',
inset:0,
zIndex:25,
display:'grid',
gridTemplateRows:'44px minmax(120px,2fr) 42px 42px minmax(80px,3fr)',
background:'#263238',
boxSizing:'border-box'
}
}))


const app = ns.get('app')


const top = qq.ce({
tag:'div',
parent:app,
style:{
background:'#455A64',
display:'flex',
justifyContent:'flex-end',
alignItems:'center',
padding:'2px'
}
})


qq.ce({
tag:'button',
parent:top,
it:'×',
style:{
width:'40px',
height:'40px',
background:'#D32F2F',
color:'white',
border:'none',
borderRadius:'4px',
fontSize:'26px'
},
event:{
click:()=>app.hide()
}
})


const editor = qq.ce({
tag:'textarea',
parent:app,
style:{
width:'100%',
height:'100%',
boxSizing:'border-box',
resize:'none',
background:'#ECEFF1',
color:'#263238',
border:'none',
padding:'8px',
fontSize:'15px'
}
})


const buttons = qq.ce({
tag:'div',
parent:app,
style:{
background:'#00695C',
display:'flex',
alignItems:'center',
justifyContent:'space-around',
gap:'5px',
padding:'3px'
}
})


ns.set('eval',function(script){
return eval(script)
})


const makeButton = (parent,name,fn) => qq.ce({
tag:'button',
parent,
it:name,
style:{
flex:'1',
height:'34px',
background:'#B2DFDB',
color:'#004D40',
border:'none',
borderRadius:'4px',
fontSize:'14px'
},
event:{click:fn}
})


makeButton(buttons,'eval',()=>{
try{
ns.get('eval')(editor.value)
}catch(e){
qq.er(e)
}
})


makeButton(buttons,'clear',()=>{
editor.value = ''
})


makeButton(buttons,'copy',async()=>{
try{
await navigator.clipboard.writeText(editor.value)
}catch(e){
qq.er(e)
}
})


makeButton(buttons,'paste',async()=>{
try{
editor.value = await navigator.clipboard.readText()
}catch(e){
qq.er(e)
}
})


ns.set('buttonsApps',qq.ce({
tag:'div',
parent:app,
style:{
background:'#8D6E63'
}
}))


ns.set('panelApp',qq.ce({
tag:'div',
parent:app,
style:{
minHeight:0,
border:'2px solid #7B1FA2',
boxSizing:'border-box',
background:'#F3E5F5',
overflow:'auto'
}
}))
//======
qq.ce({
  tag:'button',
  parent:ns.get('buttonsApps'),
  it:'idb',
  event:{
    click:()=>ns.get('eval')(localStorage.getItem('idb'))
  }
})


//======


export default ns


</script>
</body>
</html>
