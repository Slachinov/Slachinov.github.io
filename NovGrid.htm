<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,
body{
width:100%;
height:100%;
margin:0;
}
</style>
<script src="js/qqv34.js"></script>
<script src="js/qqns.js"></script>
<script type="module" src="js/console.js"></script>
</head>
<body>
<script type='module'>
//==
const ns=qq.ns();qq.cl(ns);
const app=qq.ce({tag:'div',style:{
display:'grid',
gridTemplateColumns:'auto 1fr',
gridTemplateRows:'auto auto minmax(0,1fr) 30px auto',
width:'100%',
height:'100%',
gap:'1px'
}});qq.cl(app);
ns.set('app',app);


ns.set('topPanel',qq.ce({tag:'div',it:444,parent:app,style:{
gridColumn:'1/-1',gridRow:'1',background:'gray'
}}));


ns.set('leftPanel',qq.ce({tag:'div',it:'zzzzzzxxxxx',parent:app,style:{
gridColumn:'1',gridRow:'2/-2',background:'lightblue',minWidth:'0px'
}}));


ns.set('panels',qq.ce({tag:'div',it:567,parent:app,style:{
gridColumn:'2',gridRow:'2',background:'lightgray',minHeight:'10px'
}}));


ns.set('editorPanel',qq.ce({tag:'div',parent:app,style:{
gridColumn:'2',gridRow:'3',overflow:'auto', minHeight:'0'}}));


ns.set('buttons',qq.ce({tag:'div',parent:app,style:{
gridColumn:'2',gridRow:'-3',background:'orange'
},event:{click:function(){
qq.cl(ns.get('editorPanel').offsetHeight);qq.cl(ns.get('editor').clientHeight)
qq.cl(ns.get('editorPanel').scrollHeight);qq.cl(ns.get('editor').scrollHeight)

qq.cl(getComputedStyle(ns.get('editor')).overflowY);
}}}));


ns.set('bottomPanel',qq.ce({tag:'div',it:554,parent:app,style:{
gridColumn:'1/-1',gridRow:'-2',background:'blue'
}}));
qq.cl('end');
//===
const skinTextarea={
tag:'textarea',
prop:{
gettext:function(){return this.value},
settext:function(text){this.value=text},
clear:function(){this.value=''},
edit:function(){this.readOnly=false},
noedit:function(){this.readOnly=true}
},
style:{
width:'100%',
height:'100%',
boxSizing:'border-box',
resize:'none',
border:'0',
margin:'0',
padding:'4px'
},
//===

/*
event:{
swiperight:function(){qq.cl('swipe');
const text=this.gettext();
this.remove();
const div=qq.ce(skinDiv,{parent:ns.get('editorPanel')});
ns.set('editor',div);
div.settext(text);qq.cl('swipeend');
}
}*/
//===
};


const skinDiv={
tag:'div',
attr:{contenteditable:'true'},
prop:{gettext:function(){return this.innerText.replace(/\u00A0/g,' ')},
settext:function(text){this.innerText=text},
clear:function(){this.innerHTML=''},
edit:function(){this.contentEditable='true'},
noedit:function(){this.contentEditable='false'}
},
style:{
width:'100%',
height:'100%',
boxSizing:'border-box',
overflow:'auto',
outline:'none',
padding:'4px',
background:'lightgreen',
overflowWrap:'anywhere',
whiteSpace:'pre-wrap',
minHeight:'0'
},/*
event:{
swiperight:function(){
const text=this.gettext();
this.remove();
const textarea=qq.ce(skinTextarea,{parent:ns.get('editorPanel')});
ns.set('editor',textarea);
textarea.settext(text);
}
}*/
};
ns.set('editor',qq.ce(skinDiv,{parent:ns.get('editorPanel')}));
//=====
qq.ce({tag:'button',it:'eval',style:{fontSize:'22px'},parent:ns.get('buttons'),event:{
click:function(){
try{
eval(ns.get('editor').gettext());
}catch(e){
qq.cl(e);
}
}
}});
{
let fs='24px';
const buttons=ns.get('buttons');


qq.ce({tag:'button',it:'clear',parent:buttons,style:{fontSize:fs},event:{click:function(){
ns.get('editor').clear();
}}});


qq.ce({tag:'button',it:'\u29C9',parent:buttons,style:{fontSize:fs},event:{click:async function(){
await navigator.clipboard.writeText(ns.get('editor').gettext());
}}});


qq.ce({tag:'button',it:'\uD83D\uDCE5',parent:buttons,style:{fontSize:fs},event:{click:async function(){
ns.get('editor').settext(await navigator.clipboard.readText());
}}});


qq.ce({tag:'button',it:'noedit',parent:buttons,style:{fontSize:fs}});}

//===/=/
export default ns
qq.cl('enddd');
</script>
</body>
</html>
