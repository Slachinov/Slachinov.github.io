<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,
body{
width:100%;
height:100%;
margin:0;
}
</style>
<script src="js/qqv34.js"></script>
<script src="js/qqns1.js"></script>
<script type="module" src="js/console.js"></script>
</head>
<body>
<script type="module">

const ns = qq.ns();


ns.set('app', qq.ce({
  tag: 'div',
  style: {
    position: 'absolute',
    top: '0',
    left: '0',
    width: '100%',
    height: '100%',
    overflow: 'hidden',
    background: '#fff'
  }
}));


// --- СЛОЙ 1: ЧАТ ---
ns.set('chat', qq.ce({
  tag: 'div',
  parent: ns.get('app'),
  style: {
    position: 'absolute',
    top: '0',
    left: '0',
    width: '100%',
    height: '100%',
    display: 'flex',
    flexDirection: 'column',
    background: '#fff'
  }
}));


// шапка чата
qq.ce({
  tag: 'div',
  parent: ns.get('chat'),
  style: {
    display: 'flex',
    alignItems: 'center',
    gap: '10px',
    padding: '10px',
    borderBottom: '1px solid #eee',
    flexShrink: '0'
  }
});


const header = ns.get('chat').lastChild;


// кнопка ≡ - открыть список веток
const menuBtn = qq.ce({
  tag: 'button',
  parent: header,
  it: '≡',
  style: {
    fontSize: '22px',
    border: 'none',
    background: 'none',
    cursor: 'pointer'
  },
  event: {
    click: function() {
      ns.get('sidebar').show();
    }
  }
});


qq.ce({
  tag: 'div',
  parent: header,
  it: 'Чат',
  style: {
    fontSize: '18px',
    fontWeight: 'bold'
  }
});


// зона сообщений
ns.set('messages', qq.ce({
  tag: 'div',
  parent: ns.get('chat'),
  style: {
    flex: '1',
    overflowY: 'auto',
    padding: '10px'
  }
}));


// --- РЕДАКТОР ---
ns.set('editor', qq.ce({
  tag: 'div',
  parent: ns.get('chat'),
  style: {
    display: 'flex',
    alignItems: 'flex-end',
    gap: '8px',
    padding: '8px',
    borderTop: '1px solid #eee',
    background: '#fff',
    flexShrink: '0'
  }
}));


const editor = ns.get('editor');


// поле ввода
qq.ce({
  tag: 'textarea',
  parent: editor,
  attr: {
    placeholder: 'Сообщение...',
    rows: '1'
  },
  style: {
    flex: '1',
    resize: 'none',
    border: '1px solid #ddd',
    borderRadius: '20px',
    padding: '10px 14px',
    fontSize: '16px',
    outline: 'none'
  }
});


// кнопка развернуть в полный экран
const expandBtn = qq.ce({
  tag: 'button',
  parent: editor,
  it: '⤢',
  style: {
    border: 'none',
    background: 'none',
    fontSize: '20px',
    cursor: 'pointer'
  }
});


// кнопка отправить
qq.ce({
  tag: 'button',
  parent: editor,
  it: '↑',
  style: {
    width: '36px',
    height: '36px',
    borderRadius: '50%',
    border: 'none',
    background: '#007aff',
    color: '#fff',
    fontSize: '18px',
    cursor: 'pointer',
    flexShrink: '0'
  }
});


// кнопка выйти из полноэкранного - скрыта в обычном состоянии
const collapseBtn = qq.ce({
  tag: 'button',
  parent: editor,
  it: '⤢',
  style: {
    border: 'none',
    background: 'none',
    fontSize: '20px',
    cursor: 'pointer',
    display: 'none'
  }
});
</script>
</body>
</html>
